services:
  homehub:
    container_name: homehub
    build: .
    # image: ghcr.io/surajverma/homehub:latest  # Use local build instead
    ports:
      - "${HOMEHUB_PORT:-5000}:5000"
    volumes:
      - ./app:/app/app                       # Mount app directory for live code changes
      - ./templates:/app/templates           # Mount templates for live changes
      - ./static:/app/static                 # Mount static files
      - ./uploads:/app/uploads               # Persist uploads
      - ./media:/app/media                   # Persist media
      - ./pdfs:/app/pdfs                     # Persist PDFs
      - ./data:/app/data                     # Persist database
      - ./config.yml:/app/config.yml         # Config (read-write for menu visibility)
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
