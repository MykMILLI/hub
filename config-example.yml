instance_name: "My Home Hub"
password: "" #leave blank for password less access
admin_name: "Administrator"
# Address family members use to open Home Hub. Used in invite emails.
# Leave blank to use the address you are on when you send the invite (e.g. http://192.168.1.225:5001,
# which only works at home). Set it to your Tailscale / reverse-proxy URL so extended family can join from anywhere.
public_url: ""

feature_toggles:
  shopping_list: true
  media_downloader: true
  pdf_compressor: true
  qr_generator: true
  notes: true
  shared_cloud: true
  who_is_home: true
  personal_status: true
  chores: true
  recipes: true
  expiry_tracker: true
  url_shortener: true
  expense_tracker: true
  notifications: true
  shared_calendar: true
  daily_agenda: true
  meal_planner: true
  home_assistant: true
  cameras: true

home_assistant:
  enabled: true
  url: "https://home.millitop.net"
  # Optional SSO/trusted-login URL. If set, HomeHub uses this first for iframe launch.
  auto_login_url: ""

cameras:
  enabled: true
  admins:
    - Rachel
    - Mykal
  items:
    - id: "front-yard"
      name: "Front Yard"
      host: "192.168.1.120"
      scheme: "http"
      username: "admin"
      password: "CHANGE_ME"
      channel: 0
      ptz_enabled: true
      rtsp_url: "rtsp://192.168.1.120:554/h264Preview_01_main"
      rtsp_sub_url: "rtsp://192.168.1.120:554/h264Preview_01_sub"

family_members:
  - Mom
  - Dad
  - Dipanshu
  - Vivek
  - India

reminders:
  # time_format controls how reminder times are displayed in the UI.
  # Allowed values: "12h" (default) or "24h". Remove or leave blank to fall back to 12h.
  time_format: 12h

  # calendar_start_day controls which day the reminders calendar starts on.
  # Accepts full weekday names (sunday..saturday) or numeric 0-6 where 0=Sunday.  
  calendar_start_day: sunday #default is Sunday

  # Example reminder categories (keys lowercase no spaces recommended)
  categories:
    - key: health
      label: Health
      color: "#dc2626"
    - key: bills
      label: Bills
      color: "#0d9488"
    - key: school
      label: School
      color: "#7c3aed"
    - key: family
      label: Family
      color: "#2563eb"

weather:
  enabled: false
  label: "" # optional location label (appears on right of header). Leave blank to hide.
  latitude: "" # optional, leave empty to use browser geolocation
  longitude: "" # optional, leave empty to use browser geolocation
  timezone: "" # optional, e.g., "Europe/Kyiv" or "America/New_York"; if unset, API uses timezone=auto
  units: metric # metric or imperial (default: metric)
  view: compact # compact or detailed (detailed also shows today's forecast: sunrise, sunset, UV, rain %, highs/lows)

smtp:
  enabled: false
  host: "smtp.example.com"
  port: 587
  secure: false
  username: ""
  password: ""
  sender_email: "homehub@example.com"
  sender: "Family Hub <homehub@example.com>"

notifications:
  email_enabled: false
  # HomeHub custom mobile delivery (realtime stream + periodic polling)
  mobile_enabled: true
  member_emails:
    # map family member names to email addresses
    Administrator: "admin@example.com"
  categories:
    expiry: true
    meal_today: true
    shopping_add: true
    shared_cloud_add: true
    calendar_new_event: true

supabase:
  # Keep false until URL + anon key are provided.
  enabled: false
  # Enable Supabase email/password auth flow for web + mobile clients.
  auth_enabled: true
  # Use project root URL only, e.g. https://xyzcompany.supabase.co
  # Do not include /auth/v1 or /rest/v1 in this field.
  # You may provide multiple URLs (LAN + public) separated by commas.
  # Example: "http://192.168.1.161:8100,https://base.millitop.net"
  url: ""
  # Safe for client-side use (Flutter/web auth/chat in later phases).
  anon_key: ""
  # Server-only key (never expose in frontend).
  service_role_key: ""
  # Schema reserved for future direct PostgREST calls.
  schema: "public"
  # Use Supabase PostgREST as the persistent chat message store.
  chat_enabled: true
  # Table should exist in Supabase with columns:
  # id, sender, recipient, message, attachment_filename, attachment_mime, is_read, created_at
  chat_table: "homehub_chat_messages"

#Optional
theme:
  primary_color: "#1d4ed8"
  secondary_color: "#a0aec0"
  background_color: "#f7fafc"
  card_background_color: "#fff"
  text_color: "#333"
  sidebar_background_color: "#2563eb"
  sidebar_text_color: "#ffffff"
  sidebar_link_color: "rgba(255,255,255,0.95)"
  sidebar_link_border_color: "rgba(255,255,255,0.18)"
  sidebar_active_color: "#3b82f6"

# Menu visibility - toggle which menu items appear in the sidebar
menu_visibility:
  welcome: true
  shared_notes: true
  shared_cloud: true
  shopping_list: true
  chores: true
  recipes: true
  expiry_tracker: true
  url_shortener: true
  media_downloader: true
  pdf_compressor: true
  qr_generator: true
  expense_tracker: true
  shared_calendar: true
  daily_agenda: true
  meal_planner: true
  notifications: true
  home_assistant: true
  cameras: true
  settings: true
