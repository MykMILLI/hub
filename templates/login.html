{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="card p-0 overflow-hidden">
        <div class="px-6 py-5 border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-m3-primary/10 to-m3-secondary/10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white/80 dark:bg-gray-900/60 border border-white/60 dark:border-gray-700 flex items-center justify-center text-m3-primary">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Welcome back</h2>
                    <p class="text-sm text-gray-600 dark:text-gray-300">Sign in to continue to your HomeHub.</p>
                </div>
            </div>
        </div>

        {% if supabase_auth_enabled %}
        <form id="supabaseLoginForm" class="p-6 space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-2">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="email" type="email" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-m3-primary/40" placeholder="you@example.com" required>
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="password" type="password" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-m3-primary/40" placeholder="Enter password" required>
                </div>
            </div>
            <div id="supabaseLoginError" class="hidden text-sm text-red-600 dark:text-red-400"></div>
            <button id="supabaseLoginBtn" type="submit" class="w-full btn btn-primary justify-center gap-2 py-2.5">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In</span>
            </button>
        </form>
        <script>
        (function(){
            const form = document.getElementById('supabaseLoginForm');
            const emailEl = document.getElementById('email');
            const passEl = document.getElementById('password');
            const btn = document.getElementById('supabaseLoginBtn');
            const errorEl = document.getElementById('supabaseLoginError');
            if (!form || !emailEl || !passEl || !btn || !errorEl) return;

            function showError(message){
                errorEl.textContent = String(message || 'Login failed');
                errorEl.classList.remove('hidden');
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                errorEl.classList.add('hidden');

                const email = String(emailEl.value || '').trim();
                const password = String(passEl.value || '');
                if (!email || !password) {
                    showError('Email and password are required.');
                    return;
                }

                btn.disabled = true;
                try {
                    const response = await fetch('/api/supabase/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok || payload.ok === false) {
                        showError(payload.error || 'Invalid email or password.');
                        return;
                    }

                    if (payload.member_name) {
                        localStorage.setItem('username', payload.member_name);
                    }
                    window.location.href = '/';
                } catch (err) {
                    showError(String(err));
                } finally {
                    btn.disabled = false;
                }
            });
        })();
        </script>
        {% else %}
        <form method="POST" class="p-6 space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="password" type="password" name="password" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-m3-primary/40" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="w-full btn btn-primary justify-center gap-2 py-2.5">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Continue</span>
            </button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
