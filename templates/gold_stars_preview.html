<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Star Club Preview</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}?v={{ asset_version|default('1') }}">
  <style>
    :root {
      --bg: radial-gradient(circle at top left, #fff8db 0%, #fef3c7 26%, #f3ecff 70%, #efe8ff 100%);
      --surface: rgba(255, 255, 255, 0.9);
      --border: rgba(139, 92, 246, 0.2);
      --text: #3a2758;
      --muted: #6a4a91;
      --purple: #7c3aed;
      --ok: #166534;
      --warn: #9a3412;
      --danger: #be123c;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
      display: grid;
      gap: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.9rem 1rem;
      box-shadow: 0 12px 28px rgba(76, 29, 149, 0.08);
    }
    .banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      border-radius: 999px;
      background: #ede9fe;
      color: #5b21b6;
      padding: 0.2rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .tab-btn {
      border: 1px solid #c4b5fd;
      border-radius: 999px;
      background: #f5f3ff;
      color: #5b21b6;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--purple);
      color: #fff;
      border-color: var(--purple);
    }
    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .grid-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
    }
    @media (max-width: 960px) {
      .grid-two,
      .grid-three {
        grid-template-columns: 1fr;
      }
    }
    .metric {
      border: 1px solid rgba(139, 92, 246, 0.16);
      border-radius: 0.8rem;
      padding: 0.5rem 0.65rem;
      background: #fff;
    }
    .metric p { margin: 0; }
    .metric .label { color: var(--muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; }
    .metric .value { margin-top: 0.15rem; font-size: 1.15rem; font-weight: 800; }
    .btn {
      border: 1px solid transparent;
      border-radius: 0.72rem;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-soft { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .btn-danger { background: #ffe4e6; color: var(--danger); border-color: #fecdd3; }
    .hidden { display: none !important; }
    .mini { font-size: 0.82rem; color: var(--muted); margin: 0; }
    .reward-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.65rem;
    }
    .reward-item {
      border: 1px solid rgba(139, 92, 246, 0.16);
      border-radius: 0.9rem;
      padding: 0.65rem;
      background: #fff;
    }
    .reward-illus {
      width: 100%;
      height: 92px;
      border-radius: 0.8rem;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      background: linear-gradient(165deg, #fef3c7 0%, #ede9fe 100%);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .table-like {
      display: grid;
      gap: 0.55rem;
      max-height: 360px;
      overflow: auto;
      padding-right: 0.2rem;
    }
    .row {
      border-radius: 0.75rem;
      border: 1px solid rgba(139, 92, 246, 0.16);
      background: #fff;
      padding: 0.55rem 0.65rem;
    }
    .row-title {
      margin: 0;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .status {
      display: inline-flex;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      letter-spacing: 0.02em;
    }
    .status.pending { background: #fef3c7; color: #854d0e; }
    .status.approved, .status.ready { background: #dcfce7; color: #166534; }
    .status.declined { background: #ffe4e6; color: var(--danger); }
    .status.invalidated { background: #fee2e2; color: #991b1b; }
    .status.delivered { background: #dbeafe; color: #1e3a8a; }
    .history-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    input[type="text"], input[type="number"], select {
      border: 1px solid #cbd5e1;
      border-radius: 0.6rem;
      padding: 0.42rem 0.55rem;
      font: inherit;
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }
    @media (max-width: 800px) {
      .editor-grid { grid-template-columns: 1fr; }
    }
    .character {
      width: 136px;
      aspect-ratio: 1;
      margin: 0 auto;
      position: relative;
      cursor: pointer;
      filter: drop-shadow(0 10px 16px rgba(131, 77, 19, 0.3));
      touch-action: manipulation;
    }
    .character .body {
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 61% 33%, 94% 35%, 67% 56%, 76% 88%, 50% 70%, 24% 88%, 33% 56%, 6% 35%, 39% 33%);
      background: linear-gradient(160deg, #ffe385 0%, #ffc94c 56%, #efac2f 100%);
    }
    .character .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform: translateY(7px);
      color: #4b1d1d;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .character.state-idle { animation: idle 3.6s ease-in-out infinite; }
    .character.state-noticeNewStar { animation: notice 0.95s ease-in-out infinite; }
    .character.state-tapReaction { animation: tap 0.5s ease-in-out; }
    .character.state-collecting { animation: collect 0.5s ease-in-out infinite; }
    .character.state-celebrate { animation: celebrate 0.8s ease-in-out; }
    .character.state-rewardApproved { animation: approved 0.7s ease-in-out; }
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
      gap: 0.32rem;
      max-height: 120px;
      overflow: auto;
      padding-right: 0.2rem;
    }
    .board-star {
      width: 22px;
      height: 22px;
      clip-path: polygon(50% 0%, 61% 33%, 94% 35%, 67% 56%, 76% 88%, 50% 70%, 24% 88%, 33% 56%, 6% 35%, 39% 33%);
      background: linear-gradient(160deg, #ffe17a 0%, #f6bb3d 100%);
    }
    @keyframes idle { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes notice { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    @keyframes tap { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
    @keyframes collect { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes celebrate { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes approved { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-8deg); } 65% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) {
      .character { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="card banner">
      <div>
        <span class="tag">Gold Star Club preview</span>
        <h1 class="text-xl font-bold mt-2 mb-1">Mills-Roberts Home — Isolated Rewards Prototype</h1>
        <p class="mini">Signed in as {{ actor_name }}. Session preview only, no production rewards-table writes.</p>
      </div>
      <div>
        <p class="mini mb-2">Parent URL: <code>/gold-stars/preview</code></p>
        <a class="btn btn-soft inline-block" href="/gold-stars">Back to live rewards</a>
      </div>
    </header>

    <section class="card" id="parentToolbar">
      <div class="tabs">
        <button class="tab-btn" data-view="parent-overview">Overview</button>
        <button class="tab-btn" data-view="parent-rewards">Rewards</button>
        <button class="tab-btn" data-view="parent-requests">Requests / delivery</button>
        <button class="tab-btn" data-view="parent-history">History</button>
        <button class="tab-btn" data-view="child-board" data-child="Avery">View Avery child screen</button>
        <button class="tab-btn" data-view="child-board" data-child="Harley">View Harley child screen</button>
      </div>
      <div class="flex gap-2 mt-3">
        <button class="btn btn-danger" id="resetDemoBtn">Reset preview state</button>
        <label class="mini flex items-center gap-2">
          <input type="checkbox" id="motionToggle" />
          Reduced motion override
        </label>
        <span class="mini">Sound: unavailable in this prototype.</span>
      </div>
    </section>

    <main>
      <section id="view-parent-overview" class="view card hidden"></section>
      <section id="view-parent-rewards" class="view card hidden"></section>
      <section id="view-parent-requests" class="view card hidden"></section>
      <section id="view-parent-history" class="view card hidden"></section>
      <section id="view-child-board" class="view card hidden"></section>
      <section id="view-child-rewards" class="view card hidden"></section>
      <section id="view-child-story" class="view card hidden"></section>
    </main>
  </div>

  <script>
    (() => {
      const initialState = {{ preview_state|tojson }};
      const initialView = {{ initial_view|tojson }};
      const initialChild = {{ initial_child|tojson }};
      const emojiByImageRef = { dessert: "🍨", game: "🎲", weekend: "🎟️", star: "⭐", treat: "🧁" };

      const app = {
        state: initialState,
        view: initialView || "parent-overview",
        child: initialChild || "Avery",
        historyFilterChild: "all",
        historyFilterType: "all",
        busy: false,
      };

      const dom = {
        parentToolbar: document.getElementById("parentToolbar"),
        motionToggle: document.getElementById("motionToggle"),
        resetDemoBtn: document.getElementById("resetDemoBtn"),
        views: {
          parentOverview: document.getElementById("view-parent-overview"),
          parentRewards: document.getElementById("view-parent-rewards"),
          parentRequests: document.getElementById("view-parent-requests"),
          parentHistory: document.getElementById("view-parent-history"),
          childBoard: document.getElementById("view-child-board"),
          childRewards: document.getElementById("view-child-rewards"),
          childStory: document.getElementById("view-child-story"),
        },
        tabButtons: Array.from(document.querySelectorAll(".tab-btn")),
      };

      const api = {
        state: "/api/gold-stars/preview/state",
        reset: "/api/gold-stars/preview/reset",
        prefs: "/api/gold-stars/preview/preferences",
        awards: "/api/gold-stars/preview/awards",
        collect: "/api/gold-stars/preview/awards/collect",
        catalog: "/api/gold-stars/preview/catalog",
        requestReward: "/api/gold-stars/preview/requests",
      };

      function currentChildData() {
        return (app.state.children || {})[app.child] || null;
      }

      function stateClassForCharacter(childData) {
        if (!childData) return "idle";
        if ((childData.latest_delivery || {}).status === "ready") return "rewardApproved";
        if ((childData.waiting_count || 0) > 0) return "noticeNewStar";
        return "idle";
      }

      async function requestJson(url, options) {
        const response = await fetch(url, Object.assign({
          method: "GET",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
        }, options || {}));
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.ok) {
          throw new Error(body.error || "Request failed");
        }
        return body;
      }

      function setBusy(flag) {
        app.busy = !!flag;
        for (const button of document.querySelectorAll("button")) {
          if (button.id === "resetDemoBtn" || button.dataset.action) {
            button.disabled = app.busy;
          }
        }
      }

      function escapeHtml(input) {
        return String(input || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function childUrl(childName) {
        return `/gold-stars/preview/child/${encodeURIComponent(childName || "Avery")}`;
      }

      function badge(status) {
        return `<span class="status ${escapeHtml(status)}">${escapeHtml(status)}</span>`;
      }

      function renderParentOverview() {
        const cards = ["Avery", "Harley"].map((child) => {
          const data = app.state.children[child];
          return `
            <article class="card">
              <div class="flex items-center justify-between gap-2">
                <h2 class="text-lg font-bold m-0">${child}</h2>
                <a class="btn btn-soft" href="${childUrl(child)}">Open child preview</a>
              </div>
              <div class="grid-three mt-3">
                <div class="metric"><p class="label">Available</p><p class="value">${data.available}</p></div>
                <div class="metric"><p class="label">Waiting</p><p class="value">${data.waiting_count}</p></div>
                <div class="metric"><p class="label">All-time earned</p><p class="value">${data.earned}</p></div>
                <div class="metric"><p class="label">Net spent</p><p class="value">${data.spent}</p></div>
                <div class="metric"><p class="label">Pending requests</p><p class="value">${(app.state.requests || []).filter((r) => r.child_name === child && r.status === "pending").length}</p></div>
                <div class="metric"><p class="label">Approved to deliver</p><p class="value">${(app.state.delivery_queue || []).filter((d) => d.child_name === child && d.status === "ready").length}</p></div>
              </div>
              <div class="mt-3 grid-two">
                <input type="text" data-note-input="${child}" placeholder="Optional award note" />
                <button class="btn btn-primary" data-action="award-star" data-child="${child}">Give ${child} one star</button>
              </div>
            </article>`;
        }).join("");
        dom.views.parentOverview.innerHTML = `
          <h2 class="text-xl font-bold mt-0 mb-2">Parent overview</h2>
          <p class="mini mb-3">Demo view identity never changes your real session authorization.</p>
          <div class="grid-two">${cards}</div>`;
      }

      function renderParentRewards() {
        const catalogCards = (app.state.catalog || []).map((reward) => `
          <article class="reward-item">
            <div class="reward-illus">${emojiByImageRef[reward.image_ref] || "⭐"}</div>
            <h3 class="row-title mt-2 mb-1">${escapeHtml(reward.name)}</h3>
            <p class="mini">Cost: ${reward.cost} stars</p>
            <p class="mini">Eligible: ${(reward.eligible_children || []).join(", ")}</p>
            <p class="mini">Status: ${reward.active ? "Active" : "Archived"}</p>
            <div class="flex gap-2 mt-2">
              <button class="btn btn-soft" data-action="edit-reward" data-reward-id="${reward.id}">Edit</button>
              ${reward.active ? `<button class="btn btn-danger" data-action="archive-reward" data-reward-id="${reward.id}">Archive</button>` : ""}
            </div>
          </article>
        `).join("");
        dom.views.parentRewards.innerHTML = `
          <h2 class="text-xl font-bold mt-0 mb-2">Reward catalog editor</h2>
          <p class="mini mb-3">Cost is validated server-side as integer 1-${app.state.notes.cost_bound}. Images are local illustration references for this prototype.</p>
          <form id="rewardEditorForm" class="card mb-3">
            <div class="editor-grid">
              <label class="mini">Reward name
                <input type="text" id="rewardName" required />
              </label>
              <label class="mini">Picture/illustration
                <select id="rewardImageRef">
                  <option value="dessert">Dessert illustration</option>
                  <option value="game">Game illustration</option>
                  <option value="weekend">Weekend illustration</option>
                  <option value="star">Star illustration</option>
                  <option value="treat">Treat illustration</option>
                </select>
              </label>
              <label class="mini">Exact cost
                <input type="number" id="rewardCostInput" min="1" max="${app.state.notes.cost_bound}" value="5" />
              </label>
              <label class="mini">Cost slider
                <input type="range" id="rewardCostSlider" min="1" max="${app.state.notes.cost_bound}" value="5" />
              </label>
            </div>
            <div class="flex items-center gap-4 mt-2">
              <label class="mini"><input type="checkbox" id="eligibleAvery" checked /> Avery</label>
              <label class="mini"><input type="checkbox" id="eligibleHarley" checked /> Harley</label>
              <label class="mini"><input type="checkbox" id="rewardActive" checked /> Active</label>
              <button class="btn btn-primary" type="submit">Add reward</button>
            </div>
          </form>
          <div class="reward-grid">${catalogCards || '<p class="mini">No rewards yet.</p>'}</div>`;
      }

      function renderParentRequests() {
        const requestRows = (app.state.requests || []).map((req) => `
          <article class="row">
            <div class="flex items-center justify-between gap-2">
              <p class="row-title m-0">${escapeHtml(req.child_name)} requested ${escapeHtml(req.reward_name)} (${req.requested_cost}⭐)</p>
              ${badge(req.status)}
            </div>
            <p class="mini mt-1 mb-0">${escapeHtml(req.status_message || "—")}</p>
            ${(req.status === "pending")
              ? `<div class="flex gap-2 mt-2">
                  <button class="btn btn-primary" data-action="approve-request" data-request-id="${req.id}">Approve</button>
                  <button class="btn btn-danger" data-action="decline-request" data-request-id="${req.id}">Decline</button>
                </div>` : "" }
          </article>`).join("");
        const deliveryRows = (app.state.delivery_queue || []).map((delivery) => `
          <article class="row">
            <div class="flex items-center justify-between gap-2">
              <p class="row-title m-0">${escapeHtml(delivery.child_name)} · ${escapeHtml(delivery.reward_name)} (${delivery.reward_cost}⭐)</p>
              ${badge(delivery.status)}
            </div>
            <p class="mini mt-1 mb-0">Approved by ${escapeHtml(delivery.approved_by || "parent")}</p>
            ${(delivery.status === "ready")
              ? `<button class="btn btn-primary mt-2" data-action="deliver-reward" data-delivery-id="${delivery.id}">Mark delivered</button>`
              : `<p class="mini mt-2 mb-0">Delivered by ${escapeHtml(delivery.delivered_by || "parent")}</p>`}
          </article>`).join("");
        dom.views.parentRequests.innerHTML = `
          <h2 class="text-xl font-bold mt-0 mb-2">Requests and shared delivery queue</h2>
          <div class="grid-two">
            <section>
              <h3 class="text-base font-semibold mt-0">Purchase requests</h3>
              <div class="table-like">${requestRows || '<p class="mini">No requests yet.</p>'}</div>
            </section>
            <section>
              <h3 class="text-base font-semibold mt-0">Delivery queue</h3>
              <div class="table-like">${deliveryRows || '<p class="mini">No approved rewards waiting delivery.</p>'}</div>
            </section>
          </div>`;
      }

      function renderParentHistory() {
        const allRows = app.state.history || [];
        const rows = allRows.filter((row) => {
          const childOk = app.historyFilterChild === "all" || row.child_name === app.historyFilterChild;
          const typeOk = app.historyFilterType === "all" || row.event_type === app.historyFilterType;
          return childOk && typeOk;
        });
        const items = rows.map((row) => `
          <article class="row">
            <div class="flex items-center justify-between gap-2">
              <p class="row-title m-0">${escapeHtml(row.message)}</p>
              ${badge(row.event_type)}
            </div>
            <p class="mini mt-1 mb-0">${escapeHtml(row.child_name || "Family")} · ${escapeHtml(row.actor || "system")} · ${escapeHtml(row.created_at || "")}</p>
            ${row.context ? `<p class="mini mt-1 mb-0">${escapeHtml(row.context)}</p>` : ""}
          </article>
        `).join("");
        dom.views.parentHistory.innerHTML = `
          <h2 class="text-xl font-bold mt-0 mb-2">Parent history</h2>
          <div class="history-filters">
            <select id="historyFilterChild">
              <option value="all">All children</option>
              <option value="Avery" ${app.historyFilterChild === "Avery" ? "selected" : ""}>Avery</option>
              <option value="Harley" ${app.historyFilterChild === "Harley" ? "selected" : ""}>Harley</option>
            </select>
            <select id="historyFilterType">
              <option value="all">All activity</option>
              <option value="awarded" ${app.historyFilterType === "awarded" ? "selected" : ""}>Awarded</option>
              <option value="collected" ${app.historyFilterType === "collected" ? "selected" : ""}>Collected</option>
              <option value="requested" ${app.historyFilterType === "requested" ? "selected" : ""}>Requested</option>
              <option value="approved" ${app.historyFilterType === "approved" ? "selected" : ""}>Approved</option>
              <option value="declined" ${app.historyFilterType === "declined" ? "selected" : ""}>Declined</option>
              <option value="invalidated" ${app.historyFilterType === "invalidated" ? "selected" : ""}>Invalidated</option>
              <option value="delivered" ${app.historyFilterType === "delivered" ? "selected" : ""}>Delivered</option>
            </select>
          </div>
          <div class="table-like">${items || '<p class="mini">No history yet.</p>'}</div>`;
      }

      function childNav(active) {
        return `
          <div class="tabs mb-3">
            <button class="tab-btn ${active === "child-board" ? "active" : ""}" data-view="child-board" data-child="${app.child}">My Board</button>
            <button class="tab-btn ${active === "child-rewards" ? "active" : ""}" data-view="child-rewards" data-child="${app.child}">My Rewards</button>
            <button class="tab-btn ${active === "child-story" ? "active" : ""}" data-view="child-story" data-child="${app.child}">My Star Story</button>
            <button class="tab-btn" data-view="parent-overview">Back to parent preview</button>
          </div>`;
      }

      function characterHtml(stateName) {
        const safeState = ["idle", "noticeNewStar", "tapReaction", "collecting", "celebrate", "rewardApproved"].includes(stateName) ? stateName : "idle";
        return `
          <div class="character state-${safeState}" data-action="tap-character">
            <div class="body"></div>
            <div class="face">★</div>
          </div>
          <p class="mini text-center mt-2">Temporary procedural star (replaceable visual component)</p>`;
      }

      function renderChildBoard() {
        const child = currentChildData();
        if (!child) return;
        const waiting = (child.waiting_awards || []).map((award) => `
          <article class="row">
            <p class="row-title m-0">Waiting star #${award.id}</p>
            <p class="mini mt-1 mb-0">${escapeHtml(award.note || "Parent approved a star")}</p>
            <button class="btn btn-primary mt-2" data-action="collect-star" data-award-id="${award.id}" data-child="${app.child}">Collect star</button>
          </article>
        `).join("");
        const stars = new Array(Math.max(0, Number(child.board_stars || 0))).fill(0).map(() => '<span class="board-star"></span>').join("");
        dom.views.childBoard.innerHTML = `
          ${childNav("child-board")}
          <h2 class="text-xl font-bold mt-0 mb-2">${app.child} · My Board</h2>
          <div class="grid-two">
            <section>
              <div class="grid-three">
                <div class="metric"><p class="label">Available</p><p class="value">${child.available}</p></div>
                <div class="metric"><p class="label">Waiting</p><p class="value">${child.waiting_count}</p></div>
                <div class="metric"><p class="label">All-time earned</p><p class="value">${child.earned}</p></div>
              </div>
              <h3 class="text-base font-semibold mt-3 mb-2">Waiting stars</h3>
              <div class="table-like">${waiting || '<p class="mini">No waiting stars right now.</p>'}</div>
              <h3 class="text-base font-semibold mt-3 mb-2">Collected board stars</h3>
              <div class="board">${stars || '<p class="mini">No stars yet.</p>'}</div>
            </section>
            <section>
              ${characterHtml(stateClassForCharacter(child))}
              <p class="mini mt-3">Character states: idle, noticeNewStar, tapReaction, collecting, celebrate, rewardApproved.</p>
              <p class="mini mt-1">Animation can fail without blocking accounting or API outcomes.</p>
              <p class="mini mt-1">Sound unavailable in this prototype.</p>
            </section>
          </div>`;
      }

      function renderChildRewards() {
        const child = currentChildData();
        if (!child) return;
        const cards = (child.active_rewards || []).map((reward) => `
          <article class="reward-item">
            <div class="reward-illus">${emojiByImageRef[reward.image_ref] || "⭐"}</div>
            <h3 class="row-title mt-2 mb-1">${escapeHtml(reward.name)}</h3>
            <p class="mini">Cost: ${reward.cost} stars</p>
            <p class="mini">Remaining after request: ${reward.remaining_after_request}</p>
            <button class="btn ${reward.affordable ? "btn-primary" : "btn-soft"} mt-2" data-action="request-reward" data-reward-id="${reward.id}" data-child="${app.child}" ${reward.affordable ? "" : "disabled"}>${reward.affordable ? "Request reward" : "Not enough stars"}</button>
          </article>
        `).join("");
        const pending = child.pending_request;
        const delivery = child.latest_delivery;
        dom.views.childRewards.innerHTML = `
          ${childNav("child-rewards")}
          <h2 class="text-xl font-bold mt-0 mb-2">${app.child} · My Rewards</h2>
          ${pending ? `<div class="row mb-3">${badge(pending.status)} <p class="mini mt-2 mb-0">Waiting for parent: ${escapeHtml(pending.reward_name)} (${pending.requested_cost}⭐)</p></div>` : ""}
          ${delivery ? `<div class="row mb-3">${badge(delivery.status)} <p class="mini mt-2 mb-0">${escapeHtml(delivery.reward_name)} · ${delivery.status === "ready" ? "Approved / ready to enjoy" : "Delivered"}</p></div>` : ""}
          <div class="reward-grid">${cards || '<p class="mini">No eligible active rewards right now.</p>'}</div>`;
      }

      function renderChildStory() {
        const child = currentChildData();
        if (!child) return;
        const timeline = (child.history || []).map((row) => `
          <article class="row">
            <div class="flex items-center justify-between gap-2">
              <p class="row-title m-0">${escapeHtml(row.message)}</p>
              ${badge(row.event_type)}
            </div>
            <p class="mini mt-1 mb-0">${escapeHtml(row.created_at || "")}</p>
            ${row.reward ? `<p class="mini mt-1 mb-0">Reward picture: ${emojiByImageRef[row.reward.image_ref] || "⭐"} ${escapeHtml(row.reward.name)}</p>` : ""}
          </article>`).join("");
        dom.views.childStory.innerHTML = `
          ${childNav("child-story")}
          <h2 class="text-xl font-bold mt-0 mb-2">${app.child} · My Star Story</h2>
          <p class="mini mb-2">Spending stars on rewards does not erase all-time earned achievements.</p>
          <div class="table-like">${timeline || '<p class="mini">No story events yet.</p>'}</div>`;
      }

      function render() {
        renderParentOverview();
        renderParentRewards();
        renderParentRequests();
        renderParentHistory();
        renderChildBoard();
        renderChildRewards();
        renderChildStory();
        const viewToId = {
          "parent-overview": "parentOverview",
          "parent-rewards": "parentRewards",
          "parent-requests": "parentRequests",
          "parent-history": "parentHistory",
          "child-board": "childBoard",
          "child-rewards": "childRewards",
          "child-story": "childStory",
        };
        for (const [key, value] of Object.entries(dom.views)) {
          value.classList.toggle("hidden", viewToId[app.view] !== key);
        }
        const childView = app.view.startsWith("child-");
        dom.parentToolbar.classList.toggle("hidden", childView);
        dom.motionToggle.checked = !app.state.motion_enabled;
        for (const tab of dom.tabButtons) {
          const tabView = tab.dataset.view || "";
          const tabChild = tab.dataset.child || "";
          const active = tabView === app.view && (!tabChild || tabChild === app.child);
          tab.classList.toggle("active", active);
        }
      }

      async function refreshState() {
        const payload = await requestJson(api.state);
        app.state = payload.state;
        render();
      }

      async function post(url, body) {
        setBusy(true);
        try {
          const payload = await requestJson(url, { method: "POST", body: JSON.stringify(body || {}) });
          app.state = payload.state || app.state;
          render();
          return payload;
        } finally {
          setBusy(false);
        }
      }

      async function put(url, body) {
        setBusy(true);
        try {
          const payload = await requestJson(url, { method: "PUT", body: JSON.stringify(body || {}) });
          app.state = payload.state || app.state;
          render();
          return payload;
        } finally {
          setBusy(false);
        }
      }

      function wireStaticEvents() {
        dom.tabButtons.forEach((tab) => {
          tab.addEventListener("click", () => {
            app.view = tab.dataset.view || "parent-overview";
            if (tab.dataset.child) app.child = tab.dataset.child;
            render();
          });
        });
        dom.resetDemoBtn.addEventListener("click", async () => {
          await post(api.reset, {});
          app.view = "parent-overview";
          app.child = "Avery";
          render();
        });
        dom.motionToggle.addEventListener("change", async () => {
          await post(api.prefs, { motion_enabled: !dom.motionToggle.checked });
        });
      }

      document.addEventListener("submit", async (event) => {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        if (form.id !== "rewardEditorForm") return;
        event.preventDefault();
        const name = document.getElementById("rewardName").value;
        const costInput = document.getElementById("rewardCostInput");
        const imageRef = document.getElementById("rewardImageRef").value;
        const eligibleChildren = [];
        if (document.getElementById("eligibleAvery").checked) eligibleChildren.push("Avery");
        if (document.getElementById("eligibleHarley").checked) eligibleChildren.push("Harley");
        const active = document.getElementById("rewardActive").checked;
        await post(api.catalog, {
          name,
          cost: Number(costInput.value),
          image_ref: imageRef,
          eligible_children: eligibleChildren,
          active,
        });
        form.reset();
        document.getElementById("rewardCostInput").value = "5";
        document.getElementById("rewardCostSlider").value = "5";
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (target.id === "rewardCostInput") {
          const slider = document.getElementById("rewardCostSlider");
          slider.value = target.value || "1";
        }
        if (target.id === "rewardCostSlider") {
          const number = document.getElementById("rewardCostInput");
          number.value = target.value || "1";
        }
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLSelectElement)) return;
        if (target.id === "historyFilterChild") {
          app.historyFilterChild = target.value;
          renderParentHistory();
        }
        if (target.id === "historyFilterType") {
          app.historyFilterType = target.value;
          renderParentHistory();
        }
      });

      document.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const actionEl = target.closest("[data-action]");
        if (!actionEl) return;
        const action = actionEl.getAttribute("data-action");
        if (!action) return;
        if (action === "tap-character") {
          const character = actionEl;
          character.className = "character state-tapReaction";
          window.setTimeout(() => { character.className = `character state-${stateClassForCharacter(currentChildData())}`; }, 500);
          return;
        }
        try {
          if (action === "award-star") {
            const child = actionEl.getAttribute("data-child");
            const noteInput = document.querySelector(`[data-note-input="${child}"]`);
            const note = noteInput ? noteInput.value : "";
            await post(api.awards, { child_name: child, note });
            if (noteInput) noteInput.value = "";
            return;
          }
          if (action === "collect-star") {
            await post(api.collect, {
              child_name: actionEl.getAttribute("data-child"),
              award_id: Number(actionEl.getAttribute("data-award-id")),
            });
            return;
          }
          if (action === "request-reward") {
            await post(api.requestReward, {
              child_name: actionEl.getAttribute("data-child"),
              reward_id: Number(actionEl.getAttribute("data-reward-id")),
            });
            return;
          }
          if (action === "approve-request") {
            await post(`/api/gold-stars/preview/requests/${Number(actionEl.getAttribute("data-request-id"))}/approve`, {});
            return;
          }
          if (action === "decline-request") {
            await post(`/api/gold-stars/preview/requests/${Number(actionEl.getAttribute("data-request-id"))}/decline`, {});
            return;
          }
          if (action === "deliver-reward") {
            await post(`/api/gold-stars/preview/delivery/${Number(actionEl.getAttribute("data-delivery-id"))}/deliver`, {});
            return;
          }
          if (action === "archive-reward") {
            await post(`/api/gold-stars/preview/catalog/${Number(actionEl.getAttribute("data-reward-id"))}/archive`, {});
            return;
          }
          if (action === "edit-reward") {
            const rewardId = Number(actionEl.getAttribute("data-reward-id"));
            const reward = (app.state.catalog || []).find((r) => Number(r.id) === rewardId);
            if (!reward) return;
            const nextCost = Math.max(1, Math.min(app.state.notes.cost_bound, Number(window.prompt("New cost", String(reward.cost)) || reward.cost)));
            const nextName = window.prompt("New reward name", reward.name) || reward.name;
            await put(`/api/gold-stars/preview/catalog/${rewardId}`, { name: nextName, cost: nextCost });
            return;
          }
        } catch (err) {
          window.alert(err.message || "Action failed");
        }
      });

      async function boot() {
        wireStaticEvents();
        render();
        await refreshState();
      }

      boot().catch((error) => {
        window.alert(error.message || "Failed to load preview");
      });
    })();
  </script>
</body>
</html>
