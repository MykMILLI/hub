<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ecff" />
  <title>{{ hub_name }} · Home Screen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      --bg: radial-gradient(circle at 0% 0%, #fff8db 0%, #fdf2f8 30%, #f3ecff 62%, #e0e7ff 100%);
      --card: rgba(255, 255, 255, 0.86);
      --border: rgba(139, 92, 246, 0.16);
      --text: #2e1065;
      --muted: #6b5b8a;
      --purple: #7c3aed;
      --radius: 1.35rem;
      --gap: clamp(.5rem, .9vw, .9rem);
      --fs: clamp(13px, .7vw + 5px, 20px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: var(--fs); color: var(--text); background: var(--bg); background-attachment: fixed;
      padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left)); }
    button { font: inherit; color: inherit; }
    .screen { display: grid; gap: var(--gap); max-width: 2400px; margin: 0 auto; }

    /* header */
    .top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--gap); }
    .clock { font-size: clamp(2.4rem, 4.2vw, 5.2rem); font-weight: 800; letter-spacing: -.03em; line-height: .95; font-variant-numeric: tabular-nums; }
    .clock small { font-size: .38em; font-weight: 700; margin-left: .15em; color: var(--muted); letter-spacing: 0; }
    .date { font-size: clamp(1.1rem, 1.6vw, 2rem); font-weight: 700; }
    .greet { color: var(--muted); margin-top: .15rem; }
    .top-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: .55em .95em; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--text); font-size: .85em; }

    /* quick add */
    .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); }
    .qa { border: 0; border-radius: var(--radius); padding: clamp(.45rem, .8vw, .8rem) .9rem; cursor: pointer; display: flex; align-items: center; gap: .7rem;
      font-weight: 800; font-size: 1.12em; box-shadow: 0 10px 24px rgba(76, 29, 149, .10); transition: transform .12s ease, box-shadow .12s ease; text-align: left; touch-action: manipulation; }
    .qa:active { transform: scale(.97); }
    .qa .ico { font-size: 1.7em; line-height: 1; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: .7em; background: rgba(255,255,255,.65); }
    .qa small { display: block; font-weight: 600; font-size: .7em; opacity: .75; }
    .qa-grocery { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #14532d; }
    .qa-todo { background: linear-gradient(135deg, #e0f2fe, #bae6fd); color: #0c4a6e; }
    .qa-memo { background: linear-gradient(135deg, #fef9c3, #fde68a); color: #713f12; }
    .qa-event { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #4c1d95; }
    .qa-star { background: linear-gradient(135deg, #fff7d6, #fcd34d); color: #78350f; }

    /* layout: one screen, no scrolling (landscape tablets, laptops, TVs).
       Row 1 verse/motivation strip; row 2 album | groceries | agenda;
       row 3 to-dos | star chart | memos. Panels scroll inside if they overflow. */
    .grid { display: grid; gap: var(--gap); min-height: 0;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.25fr);
      grid-template-areas: "inspire inspire inspire" "photos lists agenda" "todos stars memos"; }
    .a-photos { grid-area: photos; } .a-agenda { grid-area: agenda; } .a-inspire { grid-area: inspire; }
    .a-lists { grid-area: lists; } .a-todos { grid-area: todos; } .a-memos { grid-area: memos; } .a-stars { grid-area: stars; }
    .grid > .panel, .grid > .poster { min-height: 0; display: flex; flex-direction: column; }
    .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; }
    .grid > .panel.inspire { display: grid; }
    @media (min-width: 1000px) and (min-height: 600px) {
      html, body { height: 100%; overflow: hidden; }
      .screen { height: 100%; grid-template-rows: auto auto minmax(0, 1fr); }
    }
    @media (max-width: 999px) {
      .grid { grid-template-columns: 1fr 1fr; grid-template-rows: none;
        grid-template-areas: "inspire inspire" "photos agenda" "lists memos" "stars stars" "todos todos"; }
      .grid > .panel { max-height: 60vh; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; grid-template-areas: "inspire" "photos" "stars" "lists" "agenda" "todos" "memos"; }
      .top { grid-template-columns: 1fr; } .top-actions { justify-content: flex-start; }
    }

    /* photo album */
    .photos { position: relative; padding: 0; overflow: hidden; min-height: 200px; background: #1e1b2e; }
    .photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.2s ease; }
    .photos img.bg { object-fit: cover; filter: blur(28px) brightness(.55); transform: scale(1.15); opacity: 1; transition: none; }
    .photos img.show { opacity: 1; }
    .photos .ph-label { position: absolute; left: 1rem; top: .8rem; z-index: 2; color: #fff; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.5); font-size: .95em; }
    .photos .ph-msg { position: absolute; inset: 0; display: grid; place-items: center; color: #e9d5ff; text-align: center; padding: 2rem; z-index: 2; }
    .photos .ph-nav { position: absolute; right: .8rem; bottom: .8rem; z-index: 2; display: flex; gap: .4rem; }
    .photos .ph-nav button { border: 0; border-radius: 999px; background: rgba(255,255,255,.85); width: 2.6em; height: 2.6em; cursor: pointer; font-weight: 800; }

    /* quotes & verses */
    .inspire { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem; background: linear-gradient(135deg, rgba(254,243,199,.9), rgba(237,233,254,.9)); }
    .inspire .kind { font-size: .75em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #7c3aed; }
    .inspire { padding-top: .6rem; padding-bottom: .6rem; }
    .inspire blockquote { margin: .15rem 0 0; font-size: clamp(1rem, 1.25vw, 1.6rem); font-weight: 700; line-height: 1.3; font-family: Georgia, "Times New Roman", serif; transition: opacity .6s ease; }
    .inspire cite { display: block; margin-top: .4rem; font-style: normal; color: var(--muted); font-weight: 700; }
    .inspire .fade { opacity: 0; }

    /* star poster board */
    .poster { position: relative; border-radius: 1.2rem; padding: clamp(.6rem, 1vw, 1rem); min-height: 0; overflow-y: auto; color: #3b2414;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 40%), repeating-linear-gradient(45deg, rgba(120,80,30,.03) 0 6px, transparent 6px 12px), #f6deb0;
      border: 10px solid #b7793f; box-shadow: inset 0 0 0 3px #e7c189, 0 14px 30px rgba(76, 40, 10, .25); }
    .poster::before, .poster::after { content: ""; position: absolute; top: 6px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #c81e1e); box-shadow: 0 3px 4px rgba(0,0,0,.3); }
    .poster::before { left: 8px; } .poster::after { right: 8px; }
    .poster h2 { padding: 0 1.4rem; }
    .poster h2 { margin: 0 0 .4rem; font-family: "Marker Felt", "Comic Sans MS", "Chalkboard SE", cursive; font-size: 1.5em; color: #9a3412; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
    .poster h2 small { font-family: Inter, system-ui, sans-serif; font-size: .5em; color: #7c5a3a; font-weight: 700; }
    .chart { display: grid; grid-template-columns: minmax(6.5em, 1.1fr) repeat(7, minmax(2.6em, 1fr)) minmax(6.2em, auto); border: 3px solid #7c4a1e; border-radius: .6rem; overflow: hidden; background: rgba(255,255,255,.55); }
    .chart > div { border-right: 2px solid rgba(124,74,30,.45); border-bottom: 2px solid rgba(124,74,30,.45); padding: .25rem; min-height: 3.4em; }
    .chart .hd { min-height: auto; text-align: center; font-family: "Marker Felt", "Comic Sans MS", cursive; font-weight: 700; background: #fde68a; color: #7c2d12; }
    .chart .hd.today { background: #f59e0b; color: #fff; }
    .chart .kid { display: flex; flex-direction: column; justify-content: center; gap: .15rem; background: #fff7ed; }
    .chart .kid b { font-family: "Marker Felt", "Comic Sans MS", cursive; font-size: 1.35em; color: #1d4ed8; }
    .chart .kid:nth-of-type(odd) b { color: #be185d; }
    .chart .kid span { font-size: .8em; font-weight: 700; color: #7c5a3a; }
    .chart .kid em { font-style: normal; font-size: .75em; font-weight: 800; color: #b45309; }
    .chart .day { display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 2px; }
    .chart .day.today { background: rgba(254, 243, 199, .8); }
    .sticker { width: 1.25em; height: 1.25em; display: inline-block; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: radial-gradient(circle at 35% 30%, #fff7c2 0 12%, #ffd84d 30%, #f5b70a 70%, #d48806 100%); filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
    .sticker.pop { animation: stick .6s cubic-bezier(.2,1.6,.4,1); }
    @keyframes stick { 0% { transform: scale(2.6) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .chart .add { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: .3rem; background: #fff7ed; border-right: 0; }
    .add-star { border: 0; border-radius: 1rem; padding: .7rem .5rem; font-weight: 900; font-size: 1.05em; color: #713f12; cursor: pointer; touch-action: manipulation;
      background: linear-gradient(180deg, #fde047, #f59e0b); box-shadow: 0 5px 0 #b45309, 0 8px 14px rgba(180,83,9,.3); }
    .add-star:active { transform: translateY(4px); box-shadow: 0 1px 0 #b45309; }
    .add-star.waiting { animation: glow 1.4s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 5px 0 #b45309, 0 0 0 6px rgba(253, 224, 71, .7); } }
    .undo { border: 0; background: transparent; color: #9a3412; font-weight: 700; text-decoration: underline; cursor: pointer; font-size: .8em; }
    .pm-btn { font-family: Inter, system-ui, sans-serif; font-size: .5em; border: 2px solid #b7793f; background: #fff7ed; color: #7c2d12; border-radius: 999px; padding: .25em .8em; font-weight: 800; cursor: pointer; }
    .pm-btn.on { background: #16a34a; border-color: #15803d; color: #fff; }
    .poster.parent-mode { border-color: #16a34a; }
    .poster.parent-mode .chart .day { cursor: copy; }
    .poster.parent-mode .chart .day:hover { background: rgba(187, 247, 208, .7); }
    .poster.parent-mode .chart .day.future { cursor: default; background: transparent; }
    .poster.parent-mode .chart .day.future::after { content: none; }
    .poster.parent-mode .chart .day::after { content: "+"; color: rgba(22, 101, 52, .45); font-weight: 900; font-size: .9em; align-self: center; }
    .poster.parent-mode .sticker { cursor: pointer; outline: 2px dashed rgba(22,101,52,.0); }
    .chart .sticker { cursor: pointer; }
    .pin-input { letter-spacing: .5em; text-align: center; font-size: 1.6em !important; max-width: 9em; }
    .ask { text-align: center; }
    .ask .big { font-size: 3rem; line-height: 1; }
    .danger { background: #fee2e2; color: #b91c1c; }
    .memo .seen { display: block; font-size: .72em; color: rgba(0,0,0,.55); margin-top: .35rem; }
    .memo .ack { position: absolute; right: 2.4rem; bottom: .3rem; border: 0; background: rgba(255,255,255,.75); border-radius: 999px; padding: .2em .6em; font-weight: 800; font-size: .75em; cursor: pointer; }
    .badge-new { display: inline-block; background: #f43f5e; color: #fff; border-radius: 999px; font-size: .65em; font-weight: 900; padding: .1em .5em; margin-left: .35em; vertical-align: middle; }
    .claim { margin-left: auto; border: 0; border-radius: 999px; background: #7c3aed; color: #fff; font-weight: 800; padding: .35em .8em; cursor: pointer; white-space: nowrap; }
    .grab { display: flex; align-items: center; gap: .6rem; padding: .45rem .1rem; border-bottom: 1px dashed rgba(139, 92, 246, .15); }
    .grab:last-child { border-bottom: 0; }
    .grab .label small { display: block; color: var(--muted); font-size: .78em; }
    .tabs { display: inline-flex; background: #f3e8ff; border-radius: 999px; padding: 3px; gap: 2px; }
    .tabs button { border: 0; background: transparent; border-radius: 999px; padding: .3em .8em; font-weight: 800; font-size: .8em; cursor: pointer; color: #6b21a8; }
    .tabs button.on { background: #7c3aed; color: #fff; }
    .person { margin: .5rem 0 .2rem; display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
    .person:first-child { margin-top: 0; }
    .person small { color: var(--muted); font-weight: 700; font-size: .75em; }
    .chart-link { border: 0; background: transparent; color: var(--purple); font-weight: 700; cursor: pointer; font-size: .75em; }
    .ev { cursor: pointer; }
    .sheet.wide { max-width: 1100px; }
    .chore-grid { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: .4rem; table-layout: fixed; }
    .chore-grid th:first-child, .chore-grid td:first-child { width: 32%; }
    .chore-grid th, .chore-grid td { padding: .35rem .3rem; text-align: center; border-bottom: 1px solid #ede9fe; }
    .chore-grid th:first-child, .chore-grid td:first-child { text-align: left; }
    .chore-grid th.today, .chore-grid td.today { background: #f5f3ff; }
    .cdot { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; border: 2px solid #c4b5fd; color: #fff; font-weight: 900; }
    .cdot.done { background: #22c55e; border-color: #22c55e; }
    .cdot.tap { cursor: pointer; }
    .poster-note { margin: .6rem 0 0; font-size: .82em; color: #7c5a3a; font-weight: 600; }

    /* "added!" confirmation */
    .done-box { text-align: center; padding: 1rem 0 .2rem; }
    .done-box .tick { width: 4.2rem; height: 4.2rem; border-radius: 50%; margin: 0 auto .6rem; display: grid; place-items: center; background: #22c55e; color: #fff; font-size: 2.2rem; animation: stick .5s ease; }
    .done-box h3 { justify-content: center; }
    .field select { appearance: auto; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: clamp(.6rem, 1vw, 1.1rem); box-shadow: 0 12px 30px rgba(76, 29, 149, .07); }
    .panel h2 { margin: 0 0 .6rem; font-size: 1.05em; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .panel h2 a { font-size: .75em; color: var(--purple); text-decoration: none; font-weight: 700; }
    .stack { display: grid; gap: var(--gap); }
    .empty { color: var(--muted); padding: .4rem 0; }

    .day-label { font-size: .78em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: .7rem 0 .35rem; }
    .day-label:first-child { margin-top: 0; }
    .ev { display: grid; grid-template-columns: 5.6em 1fr; gap: .7rem; align-items: stretch; padding: .45rem 0; }
    .ev-time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: .92em; padding-top: .1em; }
    .ev-time small { display: block; font-weight: 600; color: var(--muted); font-size: .8em; }
    .ev-body { border-left: 5px solid var(--ev, var(--purple)); background: color-mix(in srgb, var(--ev, #7c3aed) 12%, white); border-radius: .8rem; padding: .45rem .7rem; }
    .ev-body b { display: block; }
    .ev-body span { color: var(--muted); font-size: .82em; }
    .ev.now .ev-body { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ev, #7c3aed) 60%, white); }

    .check { display: flex; align-items: center; gap: .7rem; width: 100%; border: 0; background: transparent; padding: .5rem .1rem; text-align: left; cursor: pointer; border-bottom: 1px dashed rgba(139, 92, 246, .15); touch-action: manipulation; }
    .check:last-child { border-bottom: 0; }
    .box { flex: 0 0 1.5em; height: 1.5em; border-radius: .45em; border: 2px solid #a78bfa; display: grid; place-items: center; font-size: .9em; color: #fff; }
    .check.done .box { background: #22c55e; border-color: #22c55e; }
    .check.done .label { text-decoration: line-through; opacity: .5; }
    .label small { display: block; color: var(--muted); font-size: .78em; }

    .memos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .65rem; }
    .memo { position: relative; background: #fef9c3; border-radius: .9rem; padding: .55rem .7rem 1.8rem; box-shadow: 0 6px 14px rgba(113, 63, 18, .10); transform: rotate(var(--tilt, -1deg)); min-height: 5em; }
    .memo:nth-child(3n+2) { background: #dcfce7; --tilt: .8deg; }
    .memo:nth-child(3n) { background: #fce7f3; --tilt: -.4deg; }
    .memo p { margin: 0; white-space: pre-wrap; word-break: break-word; font-weight: 600; }
    .memo .by { position: absolute; left: .8rem; bottom: .5rem; font-size: .72em; color: rgba(0, 0, 0, .5); }
    .memo .x { position: absolute; right: .35rem; bottom: .3rem; border: 0; background: rgba(255,255,255,.6); border-radius: 999px; width: 1.8em; height: 1.8em; cursor: pointer; }

    .stars { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .6rem; }
    .star-kid { background: #fffbeb; border: 1px solid #fde68a; border-radius: 1rem; padding: .6rem .75rem; }
    .star-kid b { font-size: 1.05em; }
    .star-kid .big { font-size: 1.6em; font-weight: 800; color: #b45309; }
    .star-kid button { margin-top: .4rem; width: 100%; border: 0; border-radius: .7rem; background: #f59e0b; color: #fff; font-weight: 800; padding: .5rem; cursor: pointer; }

    /* modal (centered with safe viewport padding; content scrolls) */
    .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: clamp(1rem, 4vw, 2.5rem); background: rgba(30, 16, 56, .45); backdrop-filter: blur(3px); }
    .modal.open { display: flex; }
    .sheet { width: 100%; max-width: 640px; max-height: calc(100dvh - 2 * clamp(1rem, 4vw, 2.5rem)); overflow-y: auto; background: #fff; border-radius: 1.5rem; padding: clamp(1rem, 2.5vw, 1.8rem); box-shadow: 0 30px 60px rgba(30, 16, 56, .3); }
    .sheet h3 { margin: 0 0 .8rem; font-size: 1.35em; display: flex; align-items: center; gap: .5rem; }
    .field { margin-top: .8rem; }
    .field > label { display: block; font-weight: 700; font-size: .85em; color: var(--muted); margin-bottom: .35rem; }
    .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select {
      width: 100%; font: inherit; font-size: 1.1em; padding: .75rem .9rem; border: 2px solid #ddd6fe; border-radius: .9rem; background: #faf5ff; color: var(--text); }
    .field textarea { min-height: 6em; resize: vertical; }
    .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
    .chip { border: 2px solid #ddd6fe; background: #fff; border-radius: 999px; padding: .45em .9em; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .chip.on { background: var(--purple); border-color: var(--purple); color: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .actions { display: flex; gap: .6rem; margin-top: 1.2rem; }
    .actions button { flex: 1; border: 0; border-radius: 1rem; padding: .95rem; font-weight: 800; font-size: 1.05em; cursor: pointer; }
    .primary { background: var(--purple); color: #fff; }
    .secondary { background: #ede9fe; color: #5b21b6; }
    .err { color: #be123c; font-weight: 700; min-height: 1.2em; margin-top: .6rem; }
    .added { color: #15803d; font-weight: 700; }

    .toast { position: fixed; left: 50%; bottom: max(1.2rem, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(250%); opacity: 0; background: #2e1065; color: #fff; padding: .8rem 1.2rem; border-radius: 999px; font-weight: 700; transition: transform .25s ease, opacity .25s ease; z-index: 60; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1s ease; z-index: 40; }
    body.night .dim { opacity: .55; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top">
      <div class="clock" id="clock" aria-live="off">--:--</div>
      <div>
        <div class="date" id="date"></div>
        <div class="greet"><span id="greetPart">Hello</span><span id="greetName" style="transition:opacity .5s ease"></span></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="fullscreenBtn" type="button">⛶ Full screen</button>
        <a class="icon-btn" href="/">☰ Home Hub</a>
        <a class="icon-btn" href="{{ millitoptv_url }}" title="Open MILLITOP TV">📺 MILLITOP TV</a>
      </div>
    </header>

    <section class="quick" id="quick" aria-label="Quick add">
      <button class="qa qa-grocery hidden-by-access" data-access="shopping_list" data-open="grocery" type="button"><span class="ico">🛒</span><span>Grocery<small>Add to the list</small></span></button>
      <button class="qa qa-todo hidden-by-access" data-access="chores" data-open="todo" type="button"><span class="ico">✅</span><span>To-do<small>Something to get done</small></span></button>
      <button class="qa qa-memo" data-open="memo" type="button"><span class="ico">📝</span><span>Memo<small>Leave a note</small></span></button>
      <button class="qa qa-event hidden-by-access" data-access="shared_calendar" data-open="event" type="button"><span class="ico">📅</span><span>Event<small>Put it on the calendar</small></span></button>
    </section>

    <section class="grid">
      <div class="panel photos a-photos" id="photos">
        <div class="ph-label">📷 Family album</div>
        <img class="bg" id="phBg" alt="" aria-hidden="true">
        <img id="phA" alt="Family photo"><img id="phB" alt="Family photo">
        <div class="ph-msg" id="phMsg">Loading photos…</div>
        <div class="ph-nav"><button type="button" id="phPrev" aria-label="Previous photo">‹</button><button type="button" id="phNext" aria-label="Next photo">›</button></div>
      </div>

      <div class="panel a-agenda hidden-by-access" data-access="shared_calendar">
        <h2>Coming up <a href="/calendar">Calendar ›</a></h2>
        <div id="agenda" class="scroll"><div class="empty">Loading…</div></div>
      </div>

      <div class="panel inspire a-inspire" id="inspire">
        <div>
          <div class="kind" id="inspKind">Today's encouragement</div>
          <blockquote id="inspText">…</blockquote>
          <cite id="inspRef"></cite>
        </div>
        <button class="icon-btn" type="button" data-open="inspire" id="inspAddBtn">＋ Add verse or quote</button>
      </div>

      <div class="panel a-lists hidden-by-access" data-access="shopping_list">
        <h2><span>🛒 <span id="groceryListName">Groceries</span></span> <a href="/shopping">All lists ›</a></h2>
        <div id="groceries" class="scroll"><div class="empty">Loading…</div></div>
      </div>

      <div class="panel a-todos hidden-by-access" data-access="chores">
        <h2><span class="tabs" role="tablist"><button type="button" data-task-tab="todo" id="tabTodo">✅ To-dos</button><button type="button" data-task-tab="chore" id="tabChore">🧹 Chores</button></span>
          <span><button type="button" class="chart-link" data-open-chores>Chore chart ›</button> <a href="/chores">All ›</a></span></h2>
        <div id="todos" class="scroll"><div class="empty">Loading…</div></div>
      </div>

      <div class="panel a-memos">
        <h2>📝 Memos</h2>
        <div class="scroll"><div id="memos" class="memos"><div class="empty">Loading…</div></div></div>
      </div>

      <div class="poster a-stars hidden-by-access" data-access="reward_system" id="poster">
        <h2><span>⭐ Our Star Chart <small id="posterWeek"></small></span><button type="button" class="pm-btn" id="pmBtn">🔒 Parent</button></h2>
        <div class="chart" id="chart"></div>
        <p class="poster-note" id="posterNote"></p>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="sheet" id="sheet" autocomplete="off"></form>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="dim" id="dim" title="Tap to wake"></div>

  <script>
  (() => {
    const ME = {{ (actor_name or '')|tojson }};
    const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
    const state = {
      summary: null, people: [], household: [], access: {}, lists: [],
      groceryListId: Number(store.get('homeScreenGroceryList', 0)) || null,
      wakeLock: null, wakeUntil: 0, poster: null, recent: {}, nameIdx: 0,
      agendaEvents: {}, tasks: [], taskTab: store.get('homeScreenTaskTab', 'todo'),
    };
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    const pad = (n) => String(n).padStart(2, '0');
    const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

    async function api(url, options) {
      const res = await fetch(url, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, options || {}));
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) { window.location.href = '/'; throw new Error('Please sign in'); }
      if (!res.ok || (body && body.ok === false)) {
        const error = new Error((body && body.error) || 'Something went wrong');
        error.body = body; error.status = res.status;
        throw error;
      }
      return body;
    }
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ---------------------------------------------------------- clock
    function tick() {
      const now = new Date();
      const h = now.getHours();
      $('clock').innerHTML = `${((h + 11) % 12) + 1}:${pad(now.getMinutes())}<small>${h < 12 ? 'AM' : 'PM'}</small>`;
      $('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      $('greetPart').textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      // Night dimming 9pm–6am (tap to wake for 2 minutes)
      const night = (h >= 21 || h < 6) && Date.now() > state.wakeUntil;
      document.body.classList.toggle('night', night);
    }
    $('dim').addEventListener('click', () => { state.wakeUntil = Date.now() + 120000; tick(); });

    // The screen is shared, so the greeting cycles through everyone at home.
    function rotateName() {
      const names = state.household.length ? state.household : [];
      const el = $('greetName');
      if (!names.length) { el.textContent = ''; return; }
      el.style.opacity = 0;
      setTimeout(() => {
        state.nameIdx = (state.nameIdx + 1) % names.length;
        el.textContent = `, ${names[state.nameIdx]}!`;
        el.style.opacity = 1;
      }, 450);
    }
    setInterval(rotateName, 4000);

    // ---------------------------------------------------------- render
    function applyAccess() {
      document.querySelectorAll('.hidden-by-access').forEach((el) => {
        el.style.display = state.access[el.dataset.access] ? '' : 'none';
      });
    }

    function eventTimeRange(ev) {
      if (ev.is_all_day || !ev.start_time) return { a: 'All day', b: '' };
      const fmt = (t) => { const [H, M] = t.split(':').map(Number); return `${((H + 11) % 12) + 1}${M ? ':' + pad(M) : ''} ${H < 12 ? 'AM' : 'PM'}`; };
      return { a: fmt(ev.start_time), b: ev.end_time ? `to ${fmt(ev.end_time)}` : '' };
    }

    // Who an event is for: its "for" list, else the people invited (+ creator); empty = everyone.
    function eventPeople(ev) {
      const forList = (ev.for_members || []).filter(Boolean);
      if (forList.length) return forList;
      const invited = (ev.invited_members || []).filter(Boolean);
      return invited.length ? [...new Set([ev.created_by, ...invited].filter(Boolean))] : [];
    }

    async function loadAgenda() {
      if (!state.access.shared_calendar) return;
      const start = new Date();
      const end = addDays(start, 6);
      const body = await api(`/api/calendar/events?start=${iso(start)}&end=${iso(end)}`);
      const events = (body.events || []).slice();
      const nowMins = start.getHours() * 60 + start.getMinutes();
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = addDays(start, i);
        const key = iso(d);
        const list = events.filter((ev) => ev.start_date <= key && ev.end_date >= key)
          .filter((ev) => i > 0 || ev.is_all_day || !ev.end_time || (() => { const [H, M] = ev.end_time.split(':').map(Number); return H * 60 + M >= nowMins; })())
          .sort((a, b) => (a.is_all_day ? -1 : 0) - (b.is_all_day ? -1 : 0) || String(a.start_time || '').localeCompare(String(b.start_time || '')));
        if (list.length) days.push({ d, i, list });
      }
      const label = (d, i) => i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      let shown = 0;
      const html = days.map(({ d, i, list }) => {
        if (shown >= 12) return '';
        const rows = list.slice(0, Math.max(0, 12 - shown)).map((ev) => {
          shown += 1;
          const t = eventTimeRange(ev);
          let isNow = false;
          if (i === 0 && ev.start_time && ev.end_time) {
            const [sh, sm] = ev.start_time.split(':').map(Number); const [eh, em] = ev.end_time.split(':').map(Number);
            isNow = nowMins >= sh * 60 + sm && nowMins < eh * 60 + em;
          }
          const who = eventPeople(ev);
          state.agendaEvents[ev.id] = ev;
          return `<div class="ev ${isNow ? 'now' : ''}" data-ev-id="${ev.id}" title="Tap to set who it's for" style="--ev:${esc(ev.color || '#7c3aed')}">
              <div class="ev-time">${esc(t.a)}<small>${esc(t.b)}</small></div>
              <div class="ev-body"><b>${isNow ? '🔴 ' : ''}${esc(ev.title)}</b><span>${esc(who.length ? who.join(', ') : 'Everyone')}</span></div>
            </div>`;
        }).join('');
        return `<div class="day-label">${esc(label(d, i))}</div>${rows}`;
      }).join('');
      $('agenda').innerHTML = html || '<div class="empty">Nothing on the calendar this week. 🎉</div>';
    }

    async function loadGroceries() {
      if (!state.access.shopping_list) return;
      const lists = await api('/api/shopping/lists');
      state.lists = lists.lists || [];
      if (!state.lists.some((l) => l.id === state.groceryListId)) {
        state.groceryListId = (state.lists.find((l) => l.is_default) || state.lists[0] || {}).id || null;
      }
      const current = state.lists.find((l) => l.id === state.groceryListId);
      $('groceryListName').textContent = current ? current.name : 'Groceries';
      const body = await api(`/api/shopping/items${state.groceryListId ? `?list_id=${state.groceryListId}` : ''}`);
      state.groceryListId = body.list_id;
      const items = (body.items || []).filter((i) => !i.checked).slice(0, 14);
      $('groceries').innerHTML = items.map((i) => `
        <button type="button" class="check" data-grocery="${i.id}">
          <span class="box">✓</span><span class="label">${esc(i.item)}${i.quantity && i.quantity > 1 ? ` ×${esc(i.quantity)}` : ''}<small>${esc(i.creator || '')}</small></span>
        </button>`).join('') || '<div class="empty">The list is empty.</div>';
    }

    // ---------------------------------------------------------- to-dos & chores
    const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    function choreDoneToday(t) {
      const p = t.weekly_progress;
      if (p) return !!p.current_occurrence_completed;
      return !!t.done;
    }
    function choreDueToday(t) {
      const days = t.days_of_week || [];
      return !days.length || days.includes(WEEK[new Date().getDay()]);
    }
    function choresByPerson(list) {
      const groups = new Map();
      list.forEach((t) => {
        const people = (t.assignees && t.assignees.length) ? t.assignees : ['Anyone'];
        people.forEach((p) => { if (!groups.has(p)) groups.set(p, []); groups.get(p).push(t); });
      });
      const order = state.people.map((p) => p.name);
      return [...groups.entries()].sort((a, b) => {
        const ia = order.indexOf(a[0]); const ib = order.indexOf(b[0]);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
    }
    async function loadTodos() {
      if (!state.access.chores) return;
      const list = await api(`/api/chores?include_completed=1&as_of=${iso(new Date())}`);
      state.tasks = Array.isArray(list) ? list : [];
      renderTasks();
    }
    const isNew = (t) => t.timestamp && (Date.now() - new Date(t.timestamp + (/[zZ]|[+-]\d\d:?\d\d$/.test(t.timestamp) ? '' : 'Z')).getTime()) < 48 * 3600 * 1000;
    const newBadge = (t) => (isNew(t) ? '<span class="badge-new">NEW</span>' : '');
    const isToday = (stamp) => { if (!stamp) return false; const d = new Date(stamp + (/[zZ]|[+-]\d\d:?\d\d$/.test(stamp) ? '' : 'Z')); return iso(d) === iso(new Date()); };
    function choreVisibleToday(t) {
      const days = t.days_of_week || [];
      if (days.length) return days.includes(WEEK[new Date().getDay()]);
      return !t.done || isToday(t.completed_at);  // one-off: show until done (and the day it was done)
    }
    function todoRow(t, showOwner) {
      const who = showOwner ? (t.assignees || []).join(', ') : '';
      const due = t.due_date ? new Date(`${t.due_date}T12:00:00`).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) : '';
      return `<button type="button" class="check" data-todo="${t.id}">
        <span class="box">✓</span><span class="label">${esc(t.description)}${newBadge(t)}<small>${esc([who, due && `due ${due}`].filter(Boolean).join(' · '))}</small></span>
      </button>`;
    }
    function renderTasks() {
      const todos = state.tasks.filter((t) => t.task_type !== 'chore' && !t.done);
      const chores = state.tasks.filter((t) => t.task_type === 'chore' && choreVisibleToday(t));
      const grabs = chores.filter((t) => !(t.assignees || []).length && !t.done);
      const assigned = chores.filter((t) => (t.assignees || []).length);
      const openChores = grabs.length + assigned.filter((t) => !choreDoneToday(t)).length;
      $('tabTodo').textContent = `✅ To-dos${todos.length ? ` (${todos.length})` : ''}`;
      $('tabChore').textContent = `🧹 Chores${openChores ? ` (${openChores})` : ''}`;
      $('tabTodo').classList.toggle('on', state.taskTab !== 'chore');
      $('tabChore').classList.toggle('on', state.taskTab === 'chore');
      if (state.taskTab !== 'chore') {
        const personal = todos.filter((t) => (t.tags || []).includes('personal') && (t.assignees || []).length);
        const family = todos.filter((t) => !personal.includes(t));
        const byOwner = new Map();
        personal.forEach((t) => { const o = t.assignees[0]; if (!byOwner.has(o)) byOwner.set(o, []); byOwner.get(o).push(t); });
        let html = family.length ? `<div class="person">🏠 Family <small>${family.length} to do</small></div>` + family.map((t) => todoRow(t, true)).join('') : '';
        byOwner.forEach((items, owner) => { html += `<div class="person">👤 ${esc(owner)} <small>personal</small></div>` + items.map((t) => todoRow(t, false)).join(''); });
        $('todos').innerHTML = html || '<div class="empty">All done!</div>';
        return;
      }
      let html = '';
      if (grabs.length) {
        html += `<div class="person">🙋 Up for grabs <small>anyone can take these</small></div>` + grabs.map((t) => {
          const when = t.due_date ? (t.due_date === iso(new Date()) ? 'Today' : `By ${new Date(`${t.due_date}T12:00:00`).toLocaleDateString(undefined, { weekday: 'long' })}`) : 'Any time';
          return `<div class="grab"><span class="label">${esc(t.description)}${newBadge(t)}<small>${esc(when)}</small></span><button type="button" class="claim" data-claim="${t.id}">I'll do it</button></div>`;
        }).join('');
      }
      html += choresByPerson(assigned).map(([person, items]) => {
        const done = items.filter(choreDoneToday).length;
        return `<div class="person">${esc(person)} <small>${done} of ${items.length} done today</small></div>` + items.map((t) => {
          const isDone = choreDoneToday(t);
          const p = t.weekly_progress;
          const sub = p ? `${p.completed_count} of ${p.required_count} this week` : (t.due_date && t.due_date !== iso(new Date()) ? `By ${new Date(`${t.due_date}T12:00:00`).toLocaleDateString(undefined, { weekday: 'long' })}` : 'Today');
          return `<button type="button" class="check ${isDone ? 'done' : ''}" data-chore="${t.id}" data-done="${isDone ? 1 : 0}">
            <span class="box">✓</span><span class="label">${esc(t.description)}${newBadge(t)}<small>${esc(sub)}</small></span>
          </button>`;
        }).join('');
      }).join('');
      $('todos').innerHTML = html || '<div class="empty">No chores today. 🎉</div>';
    }
    async function toggleChore(id, makeDone) {
      await api(`/api/chores/${id}/done`, { method: 'POST', body: JSON.stringify({ done: makeDone, occurrence_date: iso(new Date()) }) });
      await loadTodos();
      if (mode === 'chores') { sheet.innerHTML = forms.chores(); }
    }

    function renderMemos(memos) {
      state.memos = {};
      $('memos').innerHTML = (memos || []).map((m) => {
        state.memos[m.id] = m;
        const seen = (m.acks || []).map((a) => a.name);
        const someoneLeft = state.household.some((n) => n !== m.creator && !seen.includes(n));
        return `
        <div class="memo"><p>${esc(m.text)}</p>
        ${seen.length ? `<span class="seen">👀 Seen by ${esc(seen.join(', '))}</span>` : ''}
        <span class="by">— ${esc(m.creator)}</span>
        ${someoneLeft ? `<button class="ack" type="button" data-ack="${m.id}">👍 Got it</button>` : ''}
        ${(m.creator === ME || state.summary?.is_admin) ? `<button class="x" type="button" data-memo="${m.id}" aria-label="Clear memo">✕</button>` : ''}</div>`;
      }).join('')
        || '<div class="empty">No memos. Tap 📝 to leave one.</div>';
    }

    // ---------------------------------------------------------- star poster
    function weekStart() {
      const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d;
    }
    async function loadPoster() {
      if (!state.access.reward_system) return;
      const body = await api(`/api/gold-stars/poster?week_start=${encodeURIComponent(weekStart().toISOString())}`);
      state.poster = body.poster;
      renderPoster();
    }
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    function dayNoonIso(i) { const d = weekStart(); d.setDate(d.getDate() + i); d.setHours(12, 0, 0, 0); return d.toISOString(); }
    function dateNoonIso(yyyyMmDd) { const [y, m, d] = String(yyyyMmDd).split('-').map(Number); return new Date(y, m - 1, d, 12).toISOString(); }
    function parentMode() { return state.poster && state.poster.parent_mode; }
    function findStar(id) {
      for (const c of (state.poster?.children || [])) { const st = c.week_stars.find((x) => x.id === id); if (st) return { star: st, child: c.name }; }
      return null;
    }

    function renderPoster(popId) {
      const p = state.poster;
      if (!p) return;
      const pm = parentMode();
      const start = weekStart();
      const todayIdx = new Date().getDay();
      $('poster').classList.toggle('parent-mode', !!pm);
      $('posterWeek').textContent = `Week of ${start.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}`;
      renderParentButton();
      let html = '<div class="hd"></div>' + DAYS.map((d, i) => `<div class="hd ${i === todayIdx ? 'today' : ''}">${d}</div>`).join('') + '<div class="hd">⭐</div>';
      p.children.forEach((c) => {
        const byDay = [[], [], [], [], [], [], []];
        c.week_stars.forEach((st) => { byDay[new Date(st.at).getDay()].push(st); });
        html += `<div class="kid"><b>${esc(c.name)}</b><span>🏅 ${c.all_time} all-time</span>${c.week_stars.length ? `<em>${c.week_stars.length} this week</em>` : ''}</div>`;
        html += byDay.map((list, i) => `<div class="day ${i === todayIdx ? 'today' : ''} ${i > todayIdx ? 'future' : ''}" data-poster-day="${i}" data-child="${esc(c.name)}">${list.map((st) =>
          `<span class="sticker ${st.id === popId ? 'pop' : ''}" data-star-id="${st.id}" title="${esc(st.note || 'Gold star')}"></span>`).join('')}</div>`).join('');
        const recent = state.recent[c.name];
        const canUndo = pm && recent && Date.now() - recent.at < p.undo_seconds * 1000;
        const label = c.waiting > 0 ? `Stick my star! (${c.waiting})` : (pm ? 'Give a star ⭐' : 'Add my star ⭐');
        html += `<div class="add">
            <button type="button" class="add-star ${c.waiting > 0 ? 'waiting' : ''}" data-poster-add="${esc(c.name)}">${label}</button>
            ${canUndo ? `<button type="button" class="undo" data-poster-undo="${recent.id}" data-child="${esc(c.name)}">Oops, undo</button>` : ''}
          </div>`;
      });
      $('chart').innerHTML = html;
      $('posterNote').textContent = pm
        ? `Parent mode (${pm.by}): tap a day to add a star there, tap a star to change or remove it.`
        : 'Got a star from a grown-up? Tap your button to stick it on the chart! New stars need a parent. The chart starts fresh every Sunday.';
    }

    let pmTimer = null;
    function renderParentButton() {
      const pm = parentMode();
      const btn = $('pmBtn');
      clearInterval(pmTimer);
      if (!pm) { btn.classList.remove('on'); btn.textContent = '🔒 Parent'; return; }
      const ends = Date.now() + pm.seconds_left * 1000;
      const paint = () => {
        const left = Math.max(0, Math.round((ends - Date.now()) / 1000));
        btn.classList.add('on');
        btn.textContent = `🔓 ${pm.by} · ${Math.floor(left / 60)}:${pad(left % 60)} · Lock`;
        if (left <= 0) { clearInterval(pmTimer); loadPoster(); }
      };
      paint();
      pmTimer = setInterval(paint, 1000);
    }

    async function posterPost(url, payload) {
      const body = await api(url, { method: 'POST', body: JSON.stringify(Object.assign({ week_start: weekStart().toISOString() }, payload || {})) });
      state.poster = body.poster;
      return body;
    }

    async function refresh() {
      try {
        const summary = await api('/api/home-screen/summary');
        state.summary = summary;
        state.people = summary.people || [];
        state.access = summary.access || {};
        applyAccess();
        state.household = summary.household || [];
        $('inspAddBtn').hidden = !!summary.is_extended;
        if (!$('greetName').textContent) rotateName();
        renderMemos(summary.memos);
        await Promise.allSettled([loadAgenda(), loadGroceries(), loadTodos(), loadPoster()]);
      } catch (err) {
        console.warn(err);
      }
    }

    // ---------------------------------------------------------- list taps
    document.addEventListener('click', async (e) => {
      const g = e.target.closest('[data-grocery]');
      const t = e.target.closest('[data-todo]');
      const m = e.target.closest('[data-memo]');
      const tab = e.target.closest('[data-task-tab]');
      const ch = e.target.closest('[data-chore]');
      const evEl = e.target.closest('[data-ev-id]');
      const ackEl = e.target.closest('[data-ack]');
      const claimEl = e.target.closest('[data-claim]');
      if (ackEl) { posterCtx = { memo: state.memos[ackEl.dataset.ack] }; open('ack'); return; }
      if (claimEl) { posterCtx = { chore: state.tasks.find((t) => String(t.id) === claimEl.dataset.claim) }; if (posterCtx.chore) open('claim'); return; }
      if (tab) { state.taskTab = tab.dataset.taskTab; store.set('homeScreenTaskTab', state.taskTab); renderTasks(); return; }
      if (e.target.closest('[data-open-chores]')) { open('chores'); return; }
      if (evEl) { posterCtx = { ev: state.agendaEvents[evEl.dataset.evId] }; if (posterCtx.ev) open('whofor'); return; }
      const pa = e.target.closest('[data-poster-add]');
      const pu = e.target.closest('[data-poster-undo]');
      try {
        if (g) {
          g.classList.add('done');
          await api(`/api/shopping/${g.dataset.grocery}`, { method: 'PUT', body: JSON.stringify({ checked: true }) });
          setTimeout(loadGroceries, 700);
        }
        if (t) {
          t.classList.add('done');
          await api(`/api/chores/${t.dataset.todo}/done`, { method: 'POST', body: JSON.stringify({ done: true }) });
          toast('Nice work! ✅');
          setTimeout(loadTodos, 700);
        }
        if (ch) {
          const makeDone = ch.dataset.done !== '1';
          ch.classList.toggle('done', makeDone);
          await toggleChore(ch.dataset.chore, makeDone);
          if (makeDone) toast('Chore done! 🧹');
        }
        if (m) {
          const body = await api(`/api/home-screen/memos/${m.dataset.memo}/done`, { method: 'POST' });
          renderMemos(body.memos);
        }
        if (pa) {
          const child = pa.dataset.posterAdd;
          const c = (state.poster?.children || []).find((x) => x.name === child);
          if (c && c.waiting > 0) {
            pa.disabled = true;
            const body = await posterPost('/api/gold-stars/poster/add', { child_name: child, mode: 'stick' });
            state.recent[child] = { id: body.award_id, at: Date.now() };
            renderPoster(body.award_id);
            toast(`⭐ Great job, ${child}!`);
          } else if (parentMode()) {
            openPoster('give', { child, day: new Date().getDay() });
          } else {
            openPoster('ask', { child });
          }
        }
        if (pu) {
          const child = pu.dataset.child;
          await posterPost('/api/gold-stars/poster/undo', { award_id: Number(pu.dataset.posterUndo) });
          delete state.recent[child];
          renderPoster();
          toast('Star removed');
        }
        const starEl = e.target.closest('[data-star-id]');
        const dayEl = !starEl && e.target.closest('[data-poster-day]');
        if (starEl) {
          const found = findStar(Number(starEl.dataset.starId));
          if (found && parentMode()) openPoster('edit', found);
          else if (found) toast(`⭐ ${found.star.note || 'A gold star'} — from ${found.star.by || 'a parent'}`);
        } else if (dayEl && parentMode() && !dayEl.classList.contains('future')) {
          openPoster('give', { child: dayEl.dataset.child, day: Number(dayEl.dataset.posterDay) });
        }
        if (e.target.closest('#pmBtn')) {
          if (parentMode()) { await posterPost('/api/gold-stars/poster/lock'); renderPoster(); toast('Parent mode locked'); }
          else openPoster('unlock', {});
        }
      } catch (err) {
        toast(err.message);
        refresh();
      }
    });

          await posterPost(`/api/gold-stars/poster/stars/${posterCtx.star.id}/remove`, { reason });

    function showAdded(item, listName) {
      sheet.innerHTML = `
        <div class="done-box">
          <div class="tick">✓</div>
          <h3 id="modalTitle">Added!</h3>
          <p style="margin:.2rem 0 0;font-size:1.15em"><b>${esc(item)}</b> was added to <b>${esc(listName)}</b>.</p>
        </div>
        <div class="actions"><button type="button" class="secondary" data-close>Done</button><button type="button" class="primary" data-open-again="grocery">Add another</button></div>`;
      clearTimeout(showAdded._t);
      showAdded._t = setTimeout(() => { if (mode === 'grocery-done') close(); }, 6000);
      mode = 'grocery-done';
    }
    sheet.addEventListener('click', (e) => {
      const again = e.target.closest('[data-open-again]');
      if (again) { clearTimeout(showAdded._t); open(again.dataset.openAgain); }
    });

    function open(which) {
      mode = which;
      sheet.classList.toggle('wide', which === 'chores');
      sheet.innerHTML = forms[which]();
      modal.classList.add('open');
      if (which === 'event') {
        const now = new Date();
        const start = new Date(now); start.setMinutes(now.getMinutes() < 30 ? 30 : 60, 0, 0);
        const end = new Date(start.getTime() + 60 * 60000);
        sheet.querySelector('#eStart').value = `${pad(start.getHours())}:${pad(start.getMinutes())}`;
        sheet.querySelector('#eEnd').value = `${pad(end.getHours())}:${pad(end.getMinutes())}`;
        sheet.querySelector('#eDate').value = iso(now);
      }
      setTimeout(() => { const f = sheet.querySelector('input[type=text], textarea'); if (f) f.focus(); }, 60);
    }
    function close() { modal.classList.remove('open'); sheet.innerHTML = ''; mode = null; }
    document.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => open(b.dataset.open)));
    modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

    sheet.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = sheet.querySelector('#err');
      err.textContent = '';
      const btn = sheet.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        if (mode === 'grocery') {
          const input = sheet.querySelector('#gItem');
          const item = input.value.trim();
          if (!item) throw new Error('Type an item first.');
          const listId = Number(sheet.querySelector('#gList').value) || state.groceryListId;
          await api('/api/shopping/items', { method: 'POST', body: JSON.stringify({ item, list_id: listId, creator: ME }) });
          state.groceryListId = listId;
          store.set('homeScreenGroceryList', String(listId));
          const listName = (state.lists.find((l) => l.id === listId) || {}).name || 'the list';
          showAdded(item, listName);
          loadGroceries();
          return;
        }
        if (mode === 'todo') {
          const description = sheet.querySelector('#tText').value.trim();
          if (!description) throw new Error('Type what needs doing first.');
          const kind = chipValues('ttype')[0] || 'general';
          const dueOffset = chipValues('due')[0];
          const dueDate = dueOffset === '' || dueOffset === undefined ? null : iso(addDays(new Date(), Number(dueOffset)));
          let payload;
          if (kind === 'general') {
            payload = { description, creator: ME, task_type: 'todo', assignees: chipValues('who'), due_date: dueDate, tags: ['family'] };
          } else if (kind === 'personal') {
            const owner = chipValues('owner')[0];
            if (!owner) throw new Error('Choose whose to-do it is.');
            payload = { description, creator: ME, task_type: 'todo', assignees: [owner], due_date: dueDate, tags: ['personal'] };
          } else {
            const cmode = chipValues('cmode')[0] || 'grab';
            const freq = chipValues('cfreq')[0] || 'today';
            const assignees = cmode === 'assign' ? chipValues('cwho') : [];
            if (cmode === 'assign' && !assignees.length) throw new Error('Choose who the chore is for.');
            const endOfWeek = addDays(new Date(), 6 - new Date().getDay());
            payload = { description, creator: ME, task_type: 'chore', assignees, tags: cmode === 'grab' ? ['up-for-grabs'] : [] };
            if (freq === 'repeat') {
              payload.days_of_week = chipValues('cdays');
              if (!payload.days_of_week.length) throw new Error('Pick at least one day.');
            } else {
              payload.due_date = iso(freq === 'week' ? endOfWeek : new Date());
            }
          }
          await api('/api/chores', { method: 'POST', body: JSON.stringify(payload) });
          state.taskTab = kind === 'chore' ? 'chore' : 'todo';
          store.set('homeScreenTaskTab', state.taskTab);
          toast(kind === 'chore' ? (payload.assignees.length ? `Chore added for ${payload.assignees.join(', ')} 🧹` : 'Chore is up for grabs 🙋') : 'To-do added ✅');
          close(); loadTodos();
        }
        if (mode === 'ack') {
          const name = chipValues('acker')[0];
          if (!name) throw new Error('Choose who saw it.');
          const body = await api(`/api/home-screen/memos/${posterCtx.memo.id}/ack`, { method: 'POST', body: JSON.stringify({ name }) });
          renderMemos(body.memos);
          toast(`Thanks, ${name}! 👍`);
          close();
        }
        if (mode === 'claim') {
          const name = chipValues('claimer')[0];
          if (!name) throw new Error('Choose who is taking it.');
          await api(`/api/chores/${posterCtx.chore.id}/claim`, { method: 'POST', body: JSON.stringify({ name }) });
          toast(`${name} took it — thank you! 🧹`);
          close(); loadTodos();
        }
        if (mode === 'whofor') {
          const ev = posterCtx.ev;
          await api(`/api/calendar/events/${ev.base_event_id || ev.id}`, { method: 'PUT', body: JSON.stringify({ for_members: chipValues('forwho') }) });
          toast('Saved');
          close(); loadAgenda();
        }
        if (mode === 'ask' || mode === 'unlock') {
          const parent = chipValues('parent')[0];
          const pin = sheet.querySelector('#pmPin').value.trim();
          if (!parent) throw new Error('No parent PIN is set up yet.');
          if (!/^\d{4}$/.test(pin)) throw new Error('Enter the 4-digit PIN.');
          try {
            await posterPost('/api/gold-stars/poster/unlock', { parent, pin });
          } finally {
            const pinEl = sheet.querySelector('#pmPin'); if (pinEl) pinEl.value = '';
          }
          renderPoster();
          if (mode === 'ask') { openPoster('give', { child: posterCtx.child, day: new Date().getDay() }); return; }
          toast(`🔓 Parent mode on for 5 minutes`);
          close();
        }
        if (mode === 'give') {
          const child = chipValues('pchild')[0];
          if (!child) throw new Error('Choose who earned it.');
          const when = chosenDayIso();
          const token = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
          const body = await posterPost('/api/gold-stars/poster/add', { mode: 'give', child_name: child, note: sheet.querySelector('#pNote').value.trim(), when, client_token: token });
          if (!when) state.recent[child] = { id: body.award_id, at: Date.now() };
          renderPoster(body.award_id);
          toast(`⭐ Star added for ${child}${when ? ` on ${new Date(when).toLocaleDateString(undefined, { weekday: 'long' })}` : ''}`);
          close();
        }
        if (mode === 'edit') {
          // only send a new day if the chosen (local) day differs from the star's day
          const v = chipValues('pday')[0];
          const chosenLocal = v === 'pick' ? sheet.querySelector('#pDate').value : (() => { const d = weekStart(); d.setDate(d.getDate() + Number(v)); return iso(d); })();
          if (!chosenLocal) throw new Error('Pick the date.');
          const when = chosenLocal === iso(new Date(posterCtx.star.at)) ? null : dateNoonIso(chosenLocal);
          await posterPost(`/api/gold-stars/poster/stars/${posterCtx.star.id}/edit`, { note: sheet.querySelector('#pNote').value.trim(), when });
          renderPoster(); close(); toast('Star updated');
        }
        if (mode === 'inspire') {
          const text = sheet.querySelector('#iText').value.trim();
          const reference = sheet.querySelector('#iRef').value.trim();
          const kind = chipValues('ikind')[0] || 'verse';
          if (!text) throw new Error('Type the words first.');
          if (kind === 'verse' && !reference) throw new Error('Add the reference, like "Psalm 118:24 (CEB)".');
          await api('/api/home-screen/inspiration', { method: 'POST', body: JSON.stringify({ kind, text, reference }) });
          toast('Added ✨ It will show up in the rotation.');
          close(); loadInspiration();
        }
        if (mode === 'memo') {
          const text = sheet.querySelector('#mText').value.trim();
          if (!text) throw new Error('Write your memo first.');
          const body = await api('/api/home-screen/memos', { method: 'POST', body: JSON.stringify({ text, from: chipValues('mfrom')[0] || '', visibility: chipValues('vis')[0] || 'family' }) });
          renderMemos(body.memos);
          toast('Memo posted 📝');
          close();
        }
        if (mode === 'event') {
          const title = sheet.querySelector('#eTitle').value.trim();
          if (!title) throw new Error('Give the event a name.');
          const when = chipValues('when')[0] || '0';
          const date = when === 'pick' ? sheet.querySelector('#eDate').value : iso(addDays(new Date(), Number(when)));
          if (!date) throw new Error('Pick a date.');
          const allDay = (chipValues('evkind')[0] || 'timed') === 'allday';
          const start = sheet.querySelector('#eStart').value;
          const end = sheet.querySelector('#eEnd').value;
          if (!allDay && !start) throw new Error('Add a start time, or choose All day.');
          if (!allDay && end && end <= start) throw new Error('The end time should be after the start time.');
          const who = chipValues('who').filter((n) => n !== ME);
          await api('/api/calendar/events', { method: 'POST', body: JSON.stringify({
            title, event_type: 'event', start_date: date, end_date: date,
            is_all_day: allDay ? 'true' : 'false', start_time: allDay ? '' : start, end_time: allDay ? '' : end,
            invited_members: who, for_members: chipValues('who'), visibility: state.summary?.is_extended ? 'everyone' : (chipValues('evvis')[0] || 'family'),
          }) });
          toast('Added to the calendar 📅');
          close(); loadAgenda();
        }
      } catch (ex) {
        err.textContent = ex.message;
        if (ex.body && ex.body.poster) { state.poster = ex.body.poster; renderPoster(); }
      } finally {
        btn.disabled = false;
      }
    });

    // ---------------------------------------------------------- photo album
    const photo = { list: [], idx: -1, front: 'phA', timer: null };
    async function loadPhotos() {
      try {
        const body = await api('/api/immich/shared-family-album');
        const images = (body.assets || []).filter((a) => a.type !== 'VIDEO');
        for (let i = images.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [images[i], images[j]] = [images[j], images[i]]; }
        photo.list = images;
        if (!images.length) throw new Error('The family album has no photos yet.');
        $('phMsg').style.display = 'none';
        showPhoto(1);
      } catch (err) {
        $('phMsg').textContent = `📷 ${err.message.includes('not configured') || err.message.includes('Immich') ? 'Connect the Shared Family Album (Immich) in Settings to show photos here.' : err.message}`;
      }
    }
    function showPhoto(step) {
      if (!photo.list.length) return;
      photo.idx = (photo.idx + step + photo.list.length) % photo.list.length;
      const src = `/api/immich/assets/${encodeURIComponent(photo.list[photo.idx].id)}/thumbnail`;
      const backId = photo.front === 'phA' ? 'phB' : 'phA';
      const back = $(backId);
      const pre = new Image();
      pre.onload = () => {
        back.src = src; $('phBg').src = src;
        back.classList.add('show'); $(photo.front).classList.remove('show');
        photo.front = backId;
      };
      pre.src = src;
      clearTimeout(photo.timer);
      photo.timer = setTimeout(() => showPhoto(1), 12000);
    }
    $('phNext').addEventListener('click', () => showPhoto(1));
    $('phPrev').addEventListener('click', () => showPhoto(-1));

    // ---------------------------------------------------------- quotes & verses
    const insp = { list: [], idx: 0 };
    async function loadInspiration() {
      try {
        const body = await api('/api/home-screen/inspiration');
        insp.list = body.items || [];
        // Start somewhere different each day, then loop.
        const day = Math.floor(Date.now() / 86400000);
        insp.idx = insp.list.length ? day % insp.list.length : 0;
        showInspiration(true);
      } catch (_) {}
    }
    function showInspiration(immediate) {
      if (!insp.list.length) return;
      const item = insp.list[insp.idx];
      const textEl = $('inspText');
      textEl.classList.add('fade');
      setTimeout(() => {
        $('inspKind').textContent = item.kind === 'verse' ? '📖 Bible verse' : '💛 Family encouragement';
        textEl.textContent = item.kind === 'verse' ? `“${item.text}”` : item.text;
        $('inspRef').textContent = item.reference || '';
        textEl.classList.remove('fade');
      }, immediate ? 0 : 600);
    }
    setInterval(() => { if (insp.list.length) { insp.idx = (insp.idx + 1) % insp.list.length; showInspiration(); } }, 20000);

    // ---------------------------------------------------------- always-on
    async function keepAwake() {
      try {
        if ('wakeLock' in navigator && !state.wakeLock) {
          state.wakeLock = await navigator.wakeLock.request('screen');
          state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
        }
      } catch (_) { /* not supported or not allowed yet */ }
    }
    document.addEventListener('pointerdown', keepAwake, { once: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); refresh(); } });
    $('fullscreenBtn').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_) { toast('Full screen is not available on this device'); }
      keepAwake();
    });

    tick();
    setInterval(tick, 1000 * 5);
    refresh();
    loadPhotos();
    loadInspiration();
    setInterval(loadPhotos, 60 * 60 * 1000);
    setInterval(() => { if (!document.hidden && !modal.classList.contains('open')) refresh(); }, 60 * 1000);
  })();
  </script>
</body>
</html>
